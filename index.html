<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Practice Form</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
    }

    .box {
        width: 380px;
        max-width: 92%;
        padding: 30px;
        background: #1b1b1b;
        border: 2px solid #ff7800;
        border-radius: 16px;
        box-shadow: 0 0 30px rgba(255,120,0,.4);
    }

    h1 {
        text-align: center;
        color: #ff8500;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 25px;
    }

    label {
        display: block;
        color: #ff9a3c;
        font-weight: bold;
        margin: 15px 0 7px;
    }

    input {
        width: 100%;
        padding: 13px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #111;
        color: white;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #ff7800;
    }

    button {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(90deg, #ff4500, #ff9900);
        color: white;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }

    button:disabled {
        opacity: .6;
    }

    #status {
        display: none;
        margin-top: 20px;
        padding: 14px;
        text-align: center;
        border: 1px solid #00c853;
        border-radius: 8px;
        color: #00e676;
    }
</style>
</head>

<body>

<div class="box">

    <h1>FREE FIRE</h1>

    <div class="subtitle">
        Player Practice Panel
    </div>

    <form id="playerForm">

        <label for="email">Gmail</label>
        <input
            id="email"
            type="email"
            placeholder="Enter Gmail"
            required
        >

        <label for="username">Username</label>
        <input
            id="username"
            type="text"
            placeholder="Enter username"
            required
        >

        <label for="uid">Free Fire UID</label>
        <input
            id="uid"
            type="text"
            inputmode="numeric"
            placeholder="Enter UID"
            required
        >

        <button id="submitButton" type="submit">
            SUBMIT
        </button>

    </form>

    <div id="status">
        ✓ Information submitted
    </div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyyGPMsg-pi5JLsWC7Ms0V5CNlW9I4IFI6laUIAWVkb02yoKTgXGFvzX8oZp-8WW2U/exec";


document.getElementById("playerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const uid =
        document.getElementById("uid").value.trim();

    const button =
        document.getElementById("submitButton");

    button.disabled = true;
    button.textContent = "SENDING...";


    const data = {
        email: email,
        username: username,
        uid: uid
    };


    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
    })
    .then(function() {

        document.getElementById("status").style.display = "block";

        button.textContent = "SUBMITTED ✓";

    })
    .catch(function(error) {

        console.error(error);

        button.disabled = false;
        button.textContent = "SUBMIT";

        alert("Submission failed.");

    });

});

</script>

</body>
</html>
